name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      DOTNET_CLI_FORCE_UTF8_ENCODING: '1'
      DOTNET_MULTILEVEL_LOOKUP: '0'
    steps:
      - name: Descargar código fuente y submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar entorno (.NET SDK y dependencias)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build\preparar-entorno.ps1

      - name: Compilar solución (Release con -warnaserror)
        shell: pwsh
        run: |
          & build\dotnet.cmd build src\Lanzador.slnx -c Release -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ejecutar pruebas unitarias
        shell: pwsh
        run: |
          & build\dotnet.cmd test src\Lanzador.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
